# Publishes the Gradle plugins: every merge into extended to GitHub Packages as a dev build,
# and a release tag to Maven Central (through the Sonatype Central Portal, with the plugin
# marker artifacts) and to the Gradle Plugin Portal.
#
# Three modes, one set of jobs:
# - dev (a push to extended, or a manual run with mode dev on extended, which the core fork's
#   dev publish starts for each of its builds): builds every publication at
#   <deploy.version>-dev.<this commit>.<core commit>, checks it, applies the plugin by its ID
#   from it, and uploads it to GitHub Packages,
#   https://maven.pkg.github.com/thisisthepy/compose-multiplatform-extended. Not signed. The
#   plugin's aliases name the core fork's dev build of <core commit>: the one named by the
#   core_commit input, or else the core fork's latest successful dev publish, so every plugin
#   dev build names libraries that exist.
# - dry run (a pull request, or a manual run with no tag): builds both, checks the dev build,
#   and checks the Central bundle signed with a key made in the job and thrown away after,
#   plugin markers included. Nothing is uploaded. The Plugin Portal is not asked anything:
#   publishPlugins --validate-only sends the plugin to the Portal with an API key to be checked
#   there, so a run without credentials cannot use it.
# - release (a tag v<version>, or a manual run naming one): the Central bundle, signed with the
#   release key, uploaded to the Central Portal, then publishPlugins. The tag must sit on a
#   merge commit on extended's first-parent line and name deploy.version: merging into
#   extended is the release, and that merge is the owner's.
#
# Secrets a release reads (dev and dry runs read none; dev uploads with GITHUB_TOKEN):
#   MAVEN_GPG_PRIVATE_KEY   the signing key, ASCII armoured (gpg --armor --export-secret-keys)
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   CENTRAL_TOKEN_USERNAME  the Central Portal user token's username half
#   CENTRAL_TOKEN_PASSWORD  the Central Portal user token's password half
#   GRADLE_PUBLISH_KEY      the Gradle Plugin Portal API key
#   GRADLE_PUBLISH_SECRET   its secret
# The release uploads run in the environments maven-central and gradle-plugin-portal, where
# required reviewers can be set.
name: Extended publish

on:
  push:
    branches:
      - extended
    tags:
      - 'v*-ext.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (v1.11.1-ext.N). Empty runs the dry run on the chosen branch.
        required: false
        default: ''
      publishing_type:
        description: USER_MANAGED waits in the Central Portal for someone to press Publish; AUTOMATIC publishes once validated.
        type: choice
        options: [ USER_MANAGED, AUTOMATIC ]
        default: USER_MANAGED
      mode:
        description: dry-run checks everything and uploads nothing; dev publishes a dev build (extended only).
        type: choice
        options: [ dry-run, dev ]
        default: dry-run
      core_commit:
        description: The core fork commit whose dev build the plugin's aliases name. Empty takes its latest dev publish.
        required: false
        default: ''
  pull_request:
    paths:
      - extended/publish/**
      - gradle-plugins/**
      - '!gradle-plugins/compose/src/test/**'
      - .github/workflows/extended-publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The coordinates every build must carry. Every plugin a jar declares must also have its
  # marker in the bundle, which the check finds by itself.
  REQUIRED: >-
    org.thisisthepy.compose:compose-gradle-plugin
    org.thisisthepy.compose:org.thisisthepy.compose.gradle.plugin

jobs:
  plan:
    name: Decide the mode
    runs-on: ubuntu-24.04
    outputs:
      central: ${{ steps.plan.outputs.central }}
      dev: ${{ steps.plan.outputs.dev }}
      release: ${{ steps.plan.outputs.release }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      suffix: ${{ steps.core.outputs.suffix || steps.plan.outputs.suffix }}
      compose_version: ${{ steps.core.outputs.compose_version }}
      material3_version: ${{ steps.core.outputs.material3_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            extended/publish
            gradle-plugins/gradle.properties
          sparse-checkout-cone-mode: false

      - name: Test the bundle tool
        run: extended/publish/tests/central-bundle.test.sh

      - name: Work out the mode, the ref and the version
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^deploy\.version=//p'; }
          tag=""
          if [[ "$EVENT" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$EVENT" == workflow_dispatch && -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          fi
          suffix="-dev.$(git rev-parse --short=10 "$GITHUB_SHA")"
          if [[ "$EVENT" == workflow_dispatch && "$INPUT_MODE" == dev && "$GITHUB_REF" != refs/heads/extended ]]; then
            echo "::error::a dev build is published from extended only, not $GITHUB_REF"
            exit 1
          fi
          if [[ ( "$EVENT" == push && "$GITHUB_REF" == refs/heads/extended ) || ( "$EVENT" == workflow_dispatch && "$INPUT_MODE" == dev && -z "$tag" ) ]]; then
            version="$(read_version < gradle-plugins/gradle.properties)"
            echo "dev build of $GITHUB_SHA: $version$suffix"
            { echo "central=false"; echo "dev=true"; echo "release=false"; echo "ref=$GITHUB_SHA"
              echo "version=$version"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$tag" ]]; then
            version="$(read_version < gradle-plugins/gradle.properties)"
            echo "dry run of $GITHUB_SHA at $version, and as $version$suffix"
            { echo "central=true"; echo "dev=true"; echo "release=false"; echo "ref=$GITHUB_SHA"
              echo "version=$version"; echo "suffix=$suffix"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --quiet --force origin "refs/tags/$tag:refs/tags/$tag" extended
          commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          parents="$(git rev-list --parents -n 1 "$commit" | wc -w)"
          if [[ "$parents" -ne 3 ]]; then
            echo "::error::$tag is on $commit, which is not a merge commit; a release is the merge into extended"
            exit 1
          fi
          if ! git rev-list --first-parent origin/extended | grep -qx "$commit"; then
            echo "::error::$tag is on $commit, which is not on extended's first-parent line"
            exit 1
          fi
          version="$(git show "$commit:gradle-plugins/gradle.properties" | read_version)"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::$tag does not name deploy.version at $commit ($version)"
            exit 1
          fi
          echo "release $tag: $commit at $version"
          { echo "central=true"; echo "dev=false"; echo "release=true"; echo "ref=$commit"
            echo "version=$version"; echo "suffix="; } >> "$GITHUB_OUTPUT"

      # Which core dev build the plugin's dev build names, and that build's versions. The core
      # fork is public, so the workflow's own token reads its runs and files.
      - name: Find the core fork's dev build
        id: core
        if: steps.plan.outputs.dev == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_CORE: ${{ inputs.core_commit }}
          SUFFIX: ${{ steps.plan.outputs.suffix }}
        run: |
          set -euo pipefail
          core=thisisthepy/compose-multiplatform-core-extended
          commit="$INPUT_CORE"
          if [[ -z "$commit" ]]; then
            commit="$(gh api "repos/$core/actions/workflows/extended-publish.yml/runs?branch=extended&event=push&status=success&per_page=1" \
              -q '.workflow_runs[0].head_sha // empty' || true)"
          fi
          if [[ -z "$commit" ]]; then
            if [[ "$EVENT" == pull_request ]]; then
              echo "::notice::the core fork has no dev publish yet; this dry run's plugin names gradle.properties' Compose versions"
              exit 0
            fi
            echo "::error::the core fork has no successful dev publish to name; a plugin dev build would name libraries that do not exist"
            exit 1
          fi
          properties="$(gh api "repos/$core/contents/gradle.properties?ref=$commit" -q .content | base64 -d)"
          line() { sed -n "s/^jetbrains\.publication\.version\.$1=//p" <<< "$properties"; }
          short="$(gh api "repos/$core/commits/$commit" -q .sha | cut -c1-10)"
          compose="$(line COMPOSE)-dev.$short"
          material3="$(line COMPOSE_MATERIAL3)"
          material3="${material3:-$(line COMPOSE)}-dev.$short"
          echo "core $commit: Compose $compose, Material 3 $material3"
          { echo "compose_version=$compose"; echo "material3_version=$material3"
            echo "suffix=$SUFFIX.$short"; } >> "$GITHUB_OUTPUT"

  bundle:
    name: Build and check the publications
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEV: ${{ needs.plan.outputs.dev }}
      CENTRAL: ${{ needs.plan.outputs.central }}
      RELEASE: ${{ needs.plan.outputs.release }}
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ needs.plan.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The plugin marker check and the consumer check, used by both builds below.
      - name: Write the checks
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/markers.py" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          staging, version = sys.argv[1:]
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          markers = []
          for directory, _, files in os.walk(staging):
              markers += [os.path.join(directory, f) for f in files if f.endswith(f".gradle.plugin-{version}.pom")]
          assert markers, "no plugin marker POM in the bundle"
          for pom in markers:
              root = ET.parse(pom).getroot()
              assert root.findtext("m:packaging", namespaces=ns) == "pom", f"{pom}: a marker's packaging is pom"
              deps = root.findall("m:dependencies/m:dependency", ns)
              assert len(deps) == 1, f"{pom}: a marker names exactly one implementation, it names {len(deps)}"
              group, artifact, ver = (deps[0].findtext(f"m:{k}", namespaces=ns) for k in ("groupId", "artifactId", "version"))
              assert ver == version, f"{pom}: the marker names {ver}, not {version}"
              path = os.path.join(staging, *group.split("."), artifact, ver, f"{artifact}-{ver}.jar")
              assert os.path.isfile(path), f"{pom}: the implementation {group}:{artifact}:{ver} is not in the bundle"
              print(f"ok    {os.path.basename(pom)} -> {group}:{artifact}:{ver}")
          PY
          # A build that asks for each plugin by its ID from the bundle alone, the way an
          # application's settings would: the marker has to lead Gradle to the jar.
          cat > "$RUNNER_TEMP/consume.sh" <<'SH'
          set -euo pipefail
          staging="$1" version="$2"
          project="$(mktemp -d "$RUNNER_TEMP/consumer.XXXXXX")"
          ids="$(find "$staging" -name "*.gradle.plugin-$version.pom" -printf '%f\n' | sed "s/\.gradle\.plugin-$version\.pom\$//")"
          {
            echo 'pluginManagement {'
            echo '  repositories {'
            echo "    exclusiveContent { forRepository { maven { url = uri(\"$staging\") } }; filter { includeGroupByRegex(\"org\\\\.thisisthepy(\\\\..*)?\") } }"
            echo '    gradlePluginPortal(); mavenCentral(); google()'
            echo '  }'
            echo '}'
            echo 'rootProject.name = "plugin-consumer"'
          } > "$project/settings.gradle.kts"
          {
            echo 'plugins {'
            for id in $ids; do echo "  id(\"$id\") version \"$version\" apply false"; done
            echo '}'
          } > "$project/build.gradle.kts"
          cat "$project/build.gradle.kts"
          (cd "$project" && "$GITHUB_WORKSPACE/gradle-plugins/gradlew" --no-daemon -q help)
          echo "ok    applied $(echo $ids | wc -w) plugin ID(s) at $version from the bundle"
          SH

      # Every publication the build has: the plugin, its marker, and the libraries beside it.
      # The javadoc jars are java's own (withJavadocJar); the sources are Kotlin, so they hold
      # little more than the package layout.
      - name: Build the dev publications
        if: env.DEV == 'true'
        working-directory: gradle-plugins
        env:
          COMPOSE_GRADLE_PLUGIN_VERSION: ${{ needs.plan.outputs.version }}${{ needs.plan.outputs.suffix }}
          COMPOSE_VERSION: ${{ needs.plan.outputs.compose_version }}
          MATERIAL3_VERSION: ${{ needs.plan.outputs.material3_version }}
        run: |
          set -euo pipefail
          versions=()
          [[ -z "$COMPOSE_VERSION" ]] || versions+=("-Pcompose.version=$COMPOSE_VERSION")
          [[ -z "$MATERIAL3_VERSION" ]] || versions+=("-Pcompose.material3.version=$MATERIAL3_VERSION")
          ./gradlew --no-daemon publishAllPublicationsToLocalDirRepository ${versions[@]+"${versions[@]}"}
          mv build/repo "$RUNNER_TEMP/dev-repo"

      - name: Check the dev build
        if: env.DEV == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I extended/publish/central_bundle.py stage --from "$RUNNER_TEMP/dev-repo" \
            --out "$RUNNER_TEMP/dev" --project thisisthepy/compose-multiplatform-extended
          python3 -I extended/publish/central_bundle.py sign "$RUNNER_TEMP/dev" --checksums-only
          req_args=()
          for coordinate in $REQUIRED; do req_args+=(--require "$coordinate"); done
          python3 -I extended/publish/central_bundle.py validate "$RUNNER_TEMP/dev" \
            --dev="$SUFFIX" --unsigned "${req_args[@]}"
          python3 -I "$RUNNER_TEMP/markers.py" "$RUNNER_TEMP/dev" "$VERSION$SUFFIX"
          bash "$RUNNER_TEMP/consume.sh" "$RUNNER_TEMP/dev" "$VERSION$SUFFIX"

      # What the plugin carries inside: its own version, the core dev build its aliases name,
      # and the upstream version the JetBrains libraries it still uses are asked for at.
      - name: Check the versions the dev plugin names
        if: env.DEV == 'true'
        shell: bash
        env:
          COMPOSE_VERSION: ${{ needs.plan.outputs.compose_version }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/dev/org/thisisthepy/compose/compose-gradle-plugin/$VERSION$SUFFIX/compose-gradle-plugin-$VERSION$SUFFIX.jar"
          config="$(javap -constants -cp "$jar" org.jetbrains.compose.ComposeBuildConfig)"
          echo "$config" | grep 'String compose'
          value() { sed -n "s/.* $1 = \"\(.*\)\";/\1/p" <<< "$config"; }
          [[ "$(value composeGradlePluginVersion)" == "$VERSION$SUFFIX" ]] ||
            { echo "::error::the plugin carries version $(value composeGradlePluginVersion), not $VERSION$SUFFIX"; exit 1; }
          if [[ -n "$COMPOSE_VERSION" ]]; then
            [[ "$(value composeVersion)" == "$COMPOSE_VERSION" ]] ||
              { echo "::error::the aliases name Compose $(value composeVersion), not the core dev build $COMPOSE_VERSION"; exit 1; }
          fi
          upstream="$(value composeUpstreamVersion)"
          [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::the upstream version is '$upstream', which still carries the fork's suffix"; exit 1; }
          echo "ok    the plugin is $VERSION$SUFFIX, names Compose $(value composeVersion), upstream $upstream"

      - uses: actions/upload-artifact@v4
        if: env.DEV == 'true'
        with:
          name: dev-repository
          path: ${{ runner.temp }}/dev
          retention-days: 3

      - name: Build the release publications
        if: env.CENTRAL == 'true'
        working-directory: gradle-plugins
        run: |
          rm -rf build/repo
          ./gradlew --no-daemon publishAllPublicationsToLocalDirRepository
          mv build/repo "$RUNNER_TEMP/release-repo"

      - name: Stage the Central bundle
        if: env.CENTRAL == 'true'
        run: |
          python3 -I extended/publish/central_bundle.py stage --from "$RUNNER_TEMP/release-repo" \
            --out "$RUNNER_TEMP/staging" --project thisisthepy/compose-multiplatform-extended
          find "$RUNNER_TEMP/staging" -name '*.pom' | sed "s|$RUNNER_TEMP/staging/||" | sort

      - name: A signing key for this run only
        if: env.CENTRAL == 'true' && env.RELEASE != 'true'
        run: |
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          extended/publish/throwaway-key.sh "$RUNNER_TEMP/gnupg"

      - name: The release signing key
        if: env.RELEASE == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$MAVEN_GPG_PRIVATE_KEY" ]] || { echo "::error::the MAVEN_GPG_PRIVATE_KEY secret is not set"; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$RUNNER_TEMP/gnupg" >> "$GITHUB_ENV"
          GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --batch --import <<< "$MAVEN_GPG_PRIVATE_KEY"

      - name: Sign and checksum
        if: env.CENTRAL == 'true'
        env:
          GPG_PASSPHRASE: ${{ needs.plan.outputs.release == 'true' && secrets.MAVEN_GPG_PASSPHRASE || '' }}
        run: python3 -I extended/publish/central_bundle.py sign "$RUNNER_TEMP/staging"

      - name: Check the Central bundle as Central would, plugin markers included
        if: env.CENTRAL == 'true'
        shell: bash
        run: |
          set -euo pipefail
          req_args=()
          for coordinate in $REQUIRED; do req_args+=(--require "$coordinate"); done
          python3 -I extended/publish/central_bundle.py validate "$RUNNER_TEMP/staging" \
            --version "$VERSION" --verify-signatures "${req_args[@]}"
          python3 -I "$RUNNER_TEMP/markers.py" "$RUNNER_TEMP/staging" "$VERSION"
          bash "$RUNNER_TEMP/consume.sh" "$RUNNER_TEMP/staging" "$VERSION"

      - name: Zip the Central bundle
        if: env.CENTRAL == 'true'
        run: python3 -I extended/publish/central_bundle.py zip "$RUNNER_TEMP/staging" "$RUNNER_TEMP/central-bundle.zip"

      - uses: actions/upload-artifact@v4
        if: env.CENTRAL == 'true'
        with:
          name: central-bundle
          path: ${{ runner.temp }}/central-bundle.zip
          retention-days: 14

  github-packages:
    name: Upload the dev build to GitHub Packages
    needs: [ plan, bundle ]
    if: needs.plan.outputs.dev == 'true' && needs.plan.outputs.central != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: extended/publish

      - uses: actions/download-artifact@v4
        with:
          name: dev-repository
          path: ${{ runner.temp }}/dev

      - name: Upload
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I extended/publish/central_bundle.py put "$RUNNER_TEMP/dev" \
            "https://maven.pkg.github.com/${{ github.repository }}"

  central:
    name: Upload to the Central Portal
    needs: [ plan, bundle ]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          sparse-checkout: extended/publish

      - uses: actions/download-artifact@v4
        with:
          name: central-bundle
          path: ${{ runner.temp }}

      - name: Upload
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
          TYPE: ${{ inputs.publishing_type || 'USER_MANAGED' }}
        run: |
          extended/publish/central-upload.sh "$RUNNER_TEMP/central-bundle.zip" \
            "compose-multiplatform-extended $VERSION" "$TYPE"

  plugin-portal:
    name: Publish to the Gradle Plugin Portal
    needs: [ plan, central ]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: gradle-plugin-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # com.gradle.plugin-publish reads the key and secret from these two variables, and
      # publishes every plugin the build declares, at deploy.version.
      - name: publishPlugins
        working-directory: gradle-plugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$GRADLE_PUBLISH_KEY" && -n "$GRADLE_PUBLISH_SECRET" ]] ||
            { echo "::error::GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET must be set"; exit 1; }
          ./gradlew --no-daemon publishPlugins
