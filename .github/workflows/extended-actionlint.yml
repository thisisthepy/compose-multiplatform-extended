# Lints the workflows this fork owns (extended-*). No paths filter: a required check that is
# skipped blocks the merge.
name: extended-actionlint

on:
  pull_request:
    branches: [ extended ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/extended-*.yml
