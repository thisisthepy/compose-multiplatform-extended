name: Test Gradle plugin
on:
  pull_request:
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'
  push:
    branches:
      - master
      - extended
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'

  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. Runs on push to a branch are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-gradle-plugin:
    strategy:
      fail-fast: false
      matrix:
        # Upstream runs macOS on macos-26-xlarge, a paid larger runner this repository's
        # account cannot start: those jobs end before their first step. The standard
        # arm64 runner passes the same suite.
        #
        # A pull request runs one cell per OS with the newest Gradle and AGP. The full
        # matrix runs on push to extended and on workflow_dispatch: its cells take 45 to
        # 105 minutes each and used to hold every concurrent job slot of the organisation.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"ubuntu-24.04","gradle":"9.5.0","agp":"9.2.0"},{"os":"macos-26","gradle":"9.5.0","agp":"9.2.0"},{"os":"windows-2022","gradle":"9.5.0","agp":"9.2.0"}]'
          || '[{"os":"ubuntu-24.04","gradle":"9.3.1","agp":"9.1.1"},{"os":"ubuntu-24.04","gradle":"9.3.1","agp":"9.2.0"},{"os":"ubuntu-24.04","gradle":"9.5.0","agp":"9.1.1"},{"os":"ubuntu-24.04","gradle":"9.5.0","agp":"9.2.0"},{"os":"macos-26","gradle":"9.3.1","agp":"9.1.1"},{"os":"macos-26","gradle":"9.3.1","agp":"9.2.0"},{"os":"macos-26","gradle":"9.5.0","agp":"9.1.1"},{"os":"macos-26","gradle":"9.5.0","agp":"9.2.0"},{"os":"windows-2022","gradle":"9.3.1","agp":"9.1.1"},{"os":"windows-2022","gradle":"9.3.1","agp":"9.2.0"},{"os":"windows-2022","gradle":"9.5.0","agp":"9.1.1"},{"os":"windows-2022","gradle":"9.5.0","agp":"9.2.0"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only save Gradle User Home state for builds on the 'master' and 'extended' branches.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/extended' }}

          # Limit the size of the cache entry.
          # These directories contain instrumented/transformed dependency jars which can be reconstructed relatively quickly.
          gradle-home-cache-excludes: |
            caches/jars-9
            caches/transforms-3

      # This repository's name makes the workspace path 18 characters longer than upstream's,
      # and the JDKs the integration tests provision unpack so deep under it that java.exe
      # fails with "Path length exceeds maximum length (PATH_MAX)" before it can load
      # bin\server\jvm.dll. A drive letter for the workspace takes 64 characters off.
      - name: Shorten the workspace path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst X: "$env:GITHUB_WORKSPACE"

      - name: Test Gradle plugin
        shell: bash
        working-directory: ${{ runner.os == 'Windows' && 'X:\gradle-plugins' || 'gradle-plugins' }}
        run: |
          ./gradlew --continue check -Pcompose.tests.gradle.versions=${{ matrix.gradle }} -Pcompose.tests.agp.versions=${{ matrix.agp }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-${{ matrix.os }}-Gradle-${{ matrix.gradle }}-Agp${{ matrix.agp }}
          path: gradle-plugins/compose/build/reports
        if: always()

      - name: Print summary
        shell: bash
        working-directory: gradle-plugins
        if: always()
        run: |
          if [[ ! -d compose/build/test-summary ]]; then
            exit 0
          fi

          cd compose/build/test-summary
          for SUMMARY_FILE in `find . -name "*.md"`; do
            FILE_NAME=`basename $SUMMARY_FILE`
            echo "## $FILE_NAME" >> $GITHUB_STEP_SUMMARY
            cat $SUMMARY_FILE >> $GITHUB_STEP_SUMMARY
          done
