# Builds and runs the Kotlin/Native desktop sample with the plugin from this branch, on macOS
# and Linux, and runs the plugin's unit tests for the native configuration. This is the gate
# for the K/N desktop path; the inherited upstream workflows are not. No paths filter: a
# skipped required check blocks a merge.
name: extended-native-packaging

on:
  pull_request:
  push:
    branches: [ extended ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, link: linkDebugExecutableMacosArm64 }
          - { name: linux-x64, os: ubuntu-24.04, link: linkDebugExecutableLinuxX64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Plugin unit tests for the native configuration
        working-directory: gradle-plugins
        run: ./gradlew --no-daemon --console=plain :compose:test --tests '*NativeLinkerOptionsTest'

      - name: Plugin to the local repository
        working-directory: gradle-plugins
        run: ./gradlew --no-daemon --console=plain :compose:publishToMavenLocal -Pdeploy.version=1.11.1-extended-dev -Pcompose.version=1.11.1

      - name: Link the sample
        working-directory: extended/native-desktop/hello
        run: ./gradlew --no-daemon --console=plain ${{ matrix.link }}

      - name: Run it
        working-directory: extended/native-desktop/hello
        run: |
          set -euo pipefail
          exe="$(find build/bin -type f -name '*.kexe' | head -1)"
          "$exe" --self-check | tee run.log
          grep -q 'self-check ok' run.log
