name: Test Gradle plugin
on:
  pull_request:
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'
  push:
    branches:
      - master
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'

jobs:
  # The plugin's aliases, and so the test projects, name the Compose libraries of
  # thisisthepy/compose-multiplatform-core-extended (org.thisisthepy.compose.*), which nothing
  # publishes yet. They are built once per runner system, for the targets the tests on that
  # system build, and handed to the test jobs as a local Maven repository.
  compose-libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platforms: jvm,js,wasmJs
          - os: macos-26-xlarge
            platforms: jvm,js,wasmJs,iosArm64,iosSimulatorArm64,macosArm64
          - os: windows-2022
            platforms: jvm,js,wasmJs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: The core fork
        uses: actions/checkout@v5
        with:
          repository: thisisthepy/compose-multiplatform-core-extended
          ref: extended
          path: core-extended

      - name: Setup JDK 21 for the core fork
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Compose libraries to the local repository
        working-directory: core-extended
        # The version the plugin asks for by default (gradle-plugins/gradle.properties).
        run: |
          export ANDROIDX_JDK21="$JAVA_HOME"
          ./gradlew --no-daemon :mpp:publishComposeJbToMavenLocal \
            -Pcompose.platforms=${{ matrix.platforms }} \
            -Pjetbrains.publication.libraries=COMPOSE,COMPOSE_MATERIAL3 \
            "-Pjetbrains.publication.version.COMPOSE=$(sed -n 's/^compose.version=//p' ../gradle-plugins/gradle.properties)" \
            "-Pjetbrains.publication.version.COMPOSE_MATERIAL3=$(sed -n 's/^compose.material3.version=//p' ../gradle-plugins/gradle.properties)"

      - name: Keep them for the tests
        run: tar -C ~/.m2/repository -cf compose-libraries.tar org/thisisthepy

      - uses: actions/upload-artifact@v4
        with:
          name: compose-libraries-${{ matrix.os }}
          path: compose-libraries.tar
          retention-days: 3

  test-gradle-plugin:
    needs: compose-libraries
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-26-xlarge', 'windows-2022']
        gradle: ['9.3.1', '9.5.0']
        agp: ['9.1.1', '9.2.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: compose-libraries-${{ matrix.os }}

      - name: Compose libraries into the local repository
        shell: bash
        run: mkdir -p ~/.m2/repository && tar -C ~/.m2/repository -xf compose-libraries.tar

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only save Gradle User Home state for builds on the 'master' branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

          # Limit the size of the cache entry.
          # These directories contain instrumented/transformed dependency jars which can be reconstructed relatively quickly.
          gradle-home-cache-excludes: |
            caches/jars-9
            caches/transforms-3

      - name: Test Gradle plugin
        shell: bash
        working-directory: gradle-plugins
        run: |
          ./gradlew --continue check -Pcompose.tests.gradle.versions=${{ matrix.gradle }} -Pcompose.tests.agp.versions=${{ matrix.agp }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-${{ matrix.os }}-Gradle-${{ matrix.gradle }}-Agp${{ matrix.agp }}
          path: gradle-plugins/compose/build/reports
        if: always()

      - name: Print summary
        shell: bash
        working-directory: gradle-plugins
        if: always()
        run: |
          if [[ ! -d compose/build/test-summary ]]; then
            exit 0
          fi

          cd compose/build/test-summary
          for SUMMARY_FILE in `find . -name "*.md"`; do
            FILE_NAME=`basename $SUMMARY_FILE`
            echo "## $FILE_NAME" >> $GITHUB_STEP_SUMMARY
            cat $SUMMARY_FILE >> $GITHUB_STEP_SUMMARY
          done
