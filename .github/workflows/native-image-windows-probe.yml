# Probes what a Compose desktop application needs to become one native-image executable on
# Windows. native-image builds for the system it runs on, so this is the only place it can be
# tried. Manual, on its own branch; nothing here gates anything.
name: native-image Windows probe

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: compose-multiplatform-core-extended ref for its Compose libraries and extended/skiko
        default: extended
  push:
    branches: [ ci/windows-native-image-probe ]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      NIK_URL: https://github.com/bell-sw/LibericaNIK/releases/download/25.0.4.1+1-25.0.4.1+2/bellsoft-liberica-vm-full-openjdk25.0.4.1+2-25.0.4.1+1-windows-amd64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: The core fork, for its Compose libraries and skiko's build scripts
        uses: actions/checkout@v4
        with:
          repository: thisisthepy/compose-multiplatform-core-extended
          ref: ${{ inputs.core_ref || 'extended' }}
          path: core-extended

      - name: Configure Gradle for this runner
        # The core fork's build asks for a heap sized for a workstation; this one has 16GB.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Compose libraries from the core fork to the local repository
        # The plugin's aliases (compose.desktop.currentOs and the rest) name the core fork's
        # libraries, org.thisisthepy.compose.*, which nothing publishes yet. The desktop
        # target and the root metadata of every Compose and Material 3 module, as a
        # development build: -ext.1-dev, the version the plugin below is built to ask for.
        working-directory: core-extended
        run: |
          export ANDROIDX_JDK21="$JAVA_HOME"
          ./gradlew --no-daemon :mpp:publishComposeJbToMavenLocal \
            -Pcompose.platforms=jvm \
            -Pjetbrains.publication.libraries=COMPOSE,COMPOSE_MATERIAL3 \
            -Pextended.publication.dev=true

      - name: Liberica NIK 25 Full
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nik.zip" "$NIK_URL"
          unzip -q "$RUNNER_TEMP/nik.zip" -d "$RUNNER_TEMP/nik"
          home="$(ls -d "$RUNNER_TEMP"/nik/*/ | head -1)"
          echo "GRAALVM_HOME=${home%/}" >> "$GITHUB_ENV"
          "${home}bin/native-image.cmd" --version

      - name: Plugin to the local repository
        working-directory: gradle-plugins
        run: >
          ./gradlew --no-daemon -q :compose:publishToMavenLocal
          -Pdeploy.version=1.11.1-ext.1-dev
          -Pcompose.version=1.11.1-ext.1-dev
          -Pcompose.material3.version=1.11.0-alpha07-ext.1-dev

      - name: Probe
        working-directory: extended/native-image/hello
        run: bash ../windows-probe.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            extended/native-image/hello/build/probe/
          if-no-files-found: ignore
