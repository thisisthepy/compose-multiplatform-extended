# The Gradle plugin's TestKit integration tests (gradlew check), moved out of the inherited
# gradle-plugin.yml, which stays disabled. Each cell takes 35 to 105 minutes, so this runs
# on push to extended and on demand, never on pull requests.
name: Extended plugin integration tests

on:
  push:
    branches: [ extended ]
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/extended-plugin-integration.yml'
  workflow_dispatch:

concurrency:
  group: extended-plugin-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The newest Gradle and AGP only. macOS uses the standard arm64 runner: the larger
        # runner upstream uses cannot be started by this account.
        os: ['ubuntu-24.04', 'macos-26', 'windows-2022']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GRADLE_VERSION: '9.5.0'
      AGP_VERSION: '9.2.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '25'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          # extended is the only ref that writes the Gradle User Home cache.
          cache-read-only: ${{ github.ref != 'refs/heads/extended' }}
          gradle-home-cache-excludes: |
            caches/jars-9
            caches/transforms-3
      # The workspace path of this repository is long enough for the JDKs the tests unpack
      # to hit PATH_MAX on Windows. A drive letter shortens it.
      - name: Shorten the workspace path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          subst X: "$env:GITHUB_WORKSPACE"
      - name: Run the integration tests
        shell: bash
        working-directory: ${{ runner.os == 'Windows' && 'X:\gradle-plugins' || 'gradle-plugins' }}
        run: ./gradlew --continue check "-Pcompose.tests.gradle.versions=$GRADLE_VERSION" "-Pcompose.tests.agp.versions=$AGP_VERSION"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-integration-reports-${{ matrix.os }}
          path: gradle-plugins/compose/build/reports
