name: Probe Windows JDK path length
on:
  pull_request:
    paths:
      - '.github/workflows/probe-win-jdk-path.yml'

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Fetch Corretto 21
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/c21.zip" https://corretto.aws/downloads/latest/amazon-corretto-21-x64-windows-jdk.zip
          ls -l "$RUNNER_TEMP/c21.zip"
      - name: Run java from home paths of several lengths
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\c21.zip"
          # Each base is the directory the archive is unpacked into. The archive has one
          # top-level folder (jdk21.x.y_z), so the Java home is one level deeper.
          $prefixes = @(
            'D:\a\compose-multiplatform\compose-multiplatform\gradle-plugins\compose\build\tmp\test-Gradle[9.5.0]-Agp[9.2.0]\work\.gradle-test-kit\.tmp\jdks\amazon-corretto-21-Amazon-Corretto-2118038290314943672486.tmp',
            'D:\a\compose-multiplatform-extended\compose-multiplatform-extended\gradle-plugins\compose\build\tmp\test-Gradle[9.5.0]-Agp[9.2.0]\work\.gradle-test-kit\.tmp\jdks\amazon-corretto-21-Amazon-Corretto-2118038290314943672486.tmp'
          )
          foreach ($p in $prefixes) {
            Write-Host "=== unpack dir length $($p.Length): $p"
            New-Item -ItemType Directory -Force -Path $p | Out-Null
            & 7z x -y -bso0 -bsp0 "-o$p" $zip
            $home21 = (Get-ChildItem -Directory $p | Select-Object -First 1).FullName
            Write-Host "java home length $($home21.Length): $home21"
            foreach ($f in @('bin\server\jvm.dll','bin\server\classes.jsa','bin\server\classes_nocoops.jsa','lib\modules')) {
              $full = Join-Path $home21 $f
              Write-Host ("  {0,4} {1} exists={2}" -f $full.Length, $f, [System.IO.File]::Exists($full))
            }
            Write-Host "--- stdout and stderr of java -Xmx32m -Xms32m -version, kept apart"
            $out = & "$home21\bin\java.exe" -Xmx32m -Xms32m -version 2>$null
            Write-Host "stdout: [$out]"
            $err = & "$home21\bin\java.exe" -Xmx32m -Xms32m -version 2>&1 | Out-String
            Write-Host "combined: $err"
            Write-Host "--- -Xshare:on (fails when the CDS archive cannot be opened)"
            & "$home21\bin\java.exe" -Xmx32m -Xms32m -Xshare:on -version 2>&1 | Out-String | Write-Host
            Remove-Item -Recurse -Force 'D:\a\compose-multiplatform' -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force 'D:\a\compose-multiplatform-extended\compose-multiplatform-extended\gradle-plugins' -ErrorAction SilentlyContinue
          }
