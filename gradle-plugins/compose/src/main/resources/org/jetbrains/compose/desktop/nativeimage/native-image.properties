# Found by native-image on the classpath. The feature does nothing unless the build names
# libraries in compose.nativeimage.staticLibraries; the exports are what its use of the
# builder's internal registration needs.
Args = --features=org.jetbrains.compose.nativeimage.StaticDesktopLibrariesFeature \
       --initialize-at-build-time=org.jetbrains.compose.nativeimage.LinkedLibraries,org.jetbrains.compose.nativeimage.LinkedLibraries$Library \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jdk=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.annotate=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.c=ALL-UNNAMED
